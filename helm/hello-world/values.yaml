replicaCount: 2

image:
  repository: ghcr.io/OWNER/REPO
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: hello-world.example.com
  tls: false

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
